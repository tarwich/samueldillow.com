<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Towers puzzle board</title>
  <desc id="desc">A warm illustration of a five by five Towers puzzle board with edge clues and filled cells.</desc>
  <rect width="1200" height="760" fill="#f7f3ea"/>
  <rect x="92" y="74" width="1016" height="612" fill="#fffdf8" stroke="#c7baa5" stroke-width="4"/>
  <g transform="translate(300 106)">
    <rect x="0" y="0" width="500" height="500" fill="#fffdf8" stroke="#22201c" stroke-width="6"/>
    <g fill="none" stroke="#ddd4c3" stroke-width="3">
      <path d="M100 0v500M200 0v500M300 0v500M400 0v500M0 100h500M0 200h500M0 300h500M0 400h500"/>
    </g>
    <g font-family="Georgia, serif" font-size="58" text-anchor="middle" dominant-baseline="middle" fill="#22201c">
      <text x="50" y="50">2</text><text x="150" y="50">4</text><text x="250" y="50">1</text><text x="350" y="50">5</text><text x="450" y="50">3</text>
      <text x="50" y="150">5</text><text x="150" y="150">1</text><text x="250" y="150">3</text><text x="350" y="150">2</text><text x="450" y="150">4</text>
      <text x="50" y="250">3</text><text x="150" y="250">2</text><text x="250" y="250">5</text><text x="350" y="250">4</text><text x="450" y="250">1</text>
      <text x="50" y="350">1</text><text x="150" y="350">5</text><text x="250" y="350">4</text><text x="350" y="350">3</text><text x="450" y="350">2</text>
      <text x="50" y="450">4</text><text x="150" y="450">3</text><text x="250" y="450">2</text><text x="350" y="450">1</text><text x="450" y="450">5</text>
    </g>
    <g font-family="SFMono-Regular, Consolas, monospace" font-size="34" text-anchor="middle" dominant-baseline="middle" fill="#9d553d">
      <text x="50" y="-42">2</text><text x="150" y="-42">2</text><text x="250" y="-42">3</text><text x="350" y="-42">1</text><text x="450" y="-42">3</text>
      <text x="50" y="542">2</text><text x="150" y="542">3</text><text x="250" y="542">2</text><text x="350" y="542">4</text><text x="450" y="542">1</text>
      <text x="-42" y="50">3</text><text x="-42" y="150">1</text><text x="-42" y="250">2</text><text x="-42" y="350">2</text><text x="-42" y="450">2</text>
      <text x="542" y="50">2</text><text x="542" y="150">2</text><text x="542" y="250">3</text><text x="542" y="350">2</text><text x="542" y="450">1</text>
    </g>
  </g>
  <text x="104" y="642" fill="#657466" font-family="SFMono-Regular, Consolas, monospace" font-size="30">LIVE GAME</text>
  <text x="104" y="608" fill="#22201c" font-family="Georgia, serif" font-size="64">Towers</text>
</svg>
