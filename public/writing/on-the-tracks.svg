<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Quiet railroad tracks</title>
  <desc id="desc">A quiet set of railroad tracks with wooden ties and uneven rocks between the rails.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d7ad" />
      <stop offset="0.46" stop-color="#d9b17d" />
      <stop offset="1" stop-color="#8c6c4d" />
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf2dc" />
      <stop offset="0.22" stop-color="#8c8174" />
      <stop offset="0.58" stop-color="#3d3d3d" />
      <stop offset="1" stop-color="#171715" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77614a" />
      <stop offset="1" stop-color="#342d28" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#201712" flood-opacity="0.28" />
    </filter>
  </defs>

